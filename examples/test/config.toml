name_project = "test"
bot_token = "write_here_bot_api_token"
admins = [ "write_here_id",]

[database]
type = "mysql"
host = "localhost"
login = "neogram"
password = "password"
port = "3306"

[import.temp]

[commands.start]
text = "Hi in bot made in NeoGram"
action = "send_text"

[commands.help]
text = "This is help menu"
