text = "It's profile"
buttons = [ [{text = "Back", type="text"}] ]

[messages.Back.state.menuProfile]
action = "send_text"
text = "It's test menu with states"
buttons = [ [{text = "Profile", type="text"}, {text="Help"}] ]

[messages.Help.state.menuProfile]
